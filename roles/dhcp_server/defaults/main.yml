---
dhcp_server_domain_name: st-potache.fr
dhcp_server_dns_servers:
  - 192.168.10.2
dhcp_server_default_lease_time: 600
dhcp_server_max_lease_time: 7200
dhcp_server_authoritative: true
dhcp_server_interfaces:
  - ens4

dhcp_server_subnets:
  - name: vlan10_services
    network: 192.168.10.0
    netmask: 255.255.255.0
    routers:
      - 192.168.10.254
    range_start: 192.168.10.10
    range_end: 192.168.10.19
  - name: vlan20_web
    network: 192.168.20.0
    netmask: 255.255.255.0
    routers:
      - 192.168.20.254
    range_start: 192.168.20.10
    range_end: 192.168.20.14
  - name: vlan30_clients
    network: 192.168.30.0
    netmask: 255.255.255.0
    routers:
      - 192.168.30.254
    range_start: 192.168.30.10
    range_end: 192.168.30.19

