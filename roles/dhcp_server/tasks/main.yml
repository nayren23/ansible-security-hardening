---
- name: Install ISC DHCP server package
  ansible.builtin.apt:
    name: isc-dhcp-server
    state: present
    update_cache: true

- name: Configure DHCP server listening interfaces
  ansible.builtin.template:
    src: isc-dhcp-server.j2
    dest: /etc/default/isc-dhcp-server
    owner: root
    group: root
    mode: '0644'
  notify: Restart isc-dhcp-server

- name: Install DHCP DDNS TSIG key received from DNS server
  ansible.builtin.copy:
    content: "{{ dhcp_server_ddns_key_content }}"
    dest: "{{ dhcp_server_ddns_key_file }}"
    owner: root
    group: root
    mode: '0600'
  when: dhcp_server_ddns_key_content is defined
  no_log: true
  notify: Restart isc-dhcp-server

- name: Recheck whether the DHCP DDNS key is installed
  ansible.builtin.stat:
    path: "{{ dhcp_server_ddns_key_file }}"
  register: dhcp_server_ddns_key_after_copy

- name: Set DDNS activation state
  ansible.builtin.set_fact:
    dhcp_server_ddns_active: "{{ dhcp_server_ddns_key_after_copy.stat.exists }}"

- name: Configure DHCP scopes and reservations
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: '0644'
    validate: >-
      /bin/sh -c 'install -m 0644 %s /etc/dhcp/dhcpd.conf.ansible-validate
      && /usr/sbin/dhcpd -t -cf /etc/dhcp/dhcpd.conf.ansible-validate
      && rm -f /etc/dhcp/dhcpd.conf.ansible-validate'
  notify: Restart isc-dhcp-server

- name: Enable and start ISC DHCP server
  ansible.builtin.service:
    name: isc-dhcp-server
    enabled: true
    state: started
