---
- name: Download official Zabbix repository package
  vars:
    zabbix_server_repository_filename: >-
      zabbix-release_latest_{{ zabbix_server_version }}%2Bdebian{{ ansible_distribution_major_version }}_all.deb
  ansible.builtin.get_url:
    url: "{{ zabbix_server_repository_base }}/{{ zabbix_server_repository_filename }}"
    dest: /tmp/zabbix-release.deb
    owner: root
    group: root
    mode: "0644"

- name: Install official Zabbix repository
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb
    state: present

- name: Install Zabbix server stack
  ansible.builtin.apt:
    name:
      - apache2
      - mariadb-server
      - locales
      - php-mysql
      - python3-pymysql
      - zabbix-apache-conf
      - zabbix-frontend-php
      - zabbix-server-mysql
      - zabbix-sql-scripts
    state: present
    update_cache: true

- name: Enable English UTF-8 locale for Zabbix frontend
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*en_US.UTF-8 UTF-8$'
    line: en_US.UTF-8 UTF-8
    owner: root
    group: root
    mode: "0644"
  notify: Generate locales

- name: Enable and start MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Check for existing Zabbix database password
  ansible.builtin.stat:
    path: "{{ zabbix_server_db_password_file }}"
  register: zabbix_server_password_file

- name: Generate Zabbix database password
  ansible.builtin.command: openssl rand -hex 24
  register: zabbix_server_generated_password
  changed_when: true
  no_log: true
  when: not zabbix_server_password_file.stat.exists

- name: Store Zabbix database password securely
  ansible.builtin.copy:
    content: "{{ zabbix_server_generated_password.stdout }}\n"
    dest: "{{ zabbix_server_db_password_file }}"
    owner: root
    group: zabbix
    mode: "0640"
  no_log: true
  when: not zabbix_server_password_file.stat.exists

- name: Read Zabbix database password
  ansible.builtin.slurp:
    src: "{{ zabbix_server_db_password_file }}"
  register: zabbix_server_password_content
  no_log: true

- name: Keep Zabbix database password in memory
  ansible.builtin.set_fact:
    zabbix_server_db_password: "{{ zabbix_server_password_content.content | b64decode | trim }}"
  no_log: true

- name: Create Zabbix database
  ansible.mysql.mysql_db:
    name: "{{ zabbix_server_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_bin
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create restricted Zabbix database account
  ansible.mysql.mysql_user:
    name: "{{ zabbix_server_db_user }}"
    host: localhost
    password: "{{ zabbix_server_db_password }}"
    priv: "{{ zabbix_server_db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Check whether Zabbix schema is imported
  ansible.builtin.command:
    argv:
      - mysql
      - --protocol=socket
      - --socket=/run/mysqld/mysqld.sock
      - --batch
      - --skip-column-names
      - -e
      - >-
        SELECT COUNT(*) FROM information_schema.tables
        WHERE table_schema='zabbix' AND table_name='users';
  register: zabbix_server_schema_status
  changed_when: false

- name: Import official Zabbix schema
  ansible.builtin.shell: >-
    set -o pipefail && zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz |
    mysql --protocol=socket --socket=/run/mysqld/mysqld.sock {{ zabbix_server_db_name }}
  args:
    executable: /bin/bash
  changed_when: true
  when: zabbix_server_schema_status.stdout | int == 0

- name: Configure Zabbix database password
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBPassword='
    line: "DBPassword={{ zabbix_server_db_password }}"
    owner: root
    group: zabbix
    mode: "0640"
  no_log: true
  notify: Restart Zabbix Server

- name: Configure PHP timezone for Zabbix
  ansible.builtin.lineinfile:
    path: /etc/zabbix/apache.conf
    regexp: '^\s*#?\s*php_value date.timezone'
    line: "        php_value date.timezone {{ zabbix_server_php_timezone }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Apache

- name: Configure Zabbix Web frontend
  ansible.builtin.template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: root
    group: www-data
    mode: "0640"
  no_log: true
  notify: Restart Apache

- name: Enable and start Zabbix services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - zabbix-server
    - apache2

- name: Apply pending Zabbix service restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Zabbix frontend
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/
    status_code: 200
  register: zabbix_server_frontend_check
  retries: 10
  delay: 3
  until: zabbix_server_frontend_check.status == 200

- name: Check for existing Zabbix administrator password
  ansible.builtin.stat:
    path: /etc/zabbix/.admin_password
  register: zabbix_server_admin_password_file

- name: Generate Zabbix administrator password
  ansible.builtin.command: openssl rand -hex 16
  register: zabbix_server_generated_admin_password
  changed_when: true
  no_log: true
  when: not zabbix_server_admin_password_file.stat.exists

- name: Store Zabbix administrator password securely
  ansible.builtin.copy:
    content: "{{ zabbix_server_generated_admin_password.stdout }}\n"
    dest: /etc/zabbix/.admin_password
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not zabbix_server_admin_password_file.stat.exists

- name: Read Zabbix administrator password
  ansible.builtin.slurp:
    src: /etc/zabbix/.admin_password
  register: zabbix_server_admin_password_content
  no_log: true

- name: Keep Zabbix administrator password in memory
  ansible.builtin.set_fact:
    zabbix_server_admin_password: "{{ zabbix_server_admin_password_content.content | b64decode | trim }}"
  no_log: true

- name: Try API login with managed administrator password
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: Admin
        password: "{{ zabbix_server_admin_password }}"
      id: 1
  register: zabbix_server_managed_login
  failed_when: false
  no_log: true

- name: Log in with initial Zabbix credentials
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: Admin
        password: "{{ zabbix_server_initial_admin_password_parts | join }}"
      id: 1
  register: zabbix_server_initial_login
  failed_when: zabbix_server_initial_login.json.error is defined
  no_log: true
  when: zabbix_server_managed_login.json.error is defined

- name: Replace initial Zabbix administrator password
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.update
      params:
        userid: "1"
        current_passwd: "{{ zabbix_server_initial_admin_password_parts | join }}"
        passwd: "{{ zabbix_server_admin_password }}"
      auth: "{{ zabbix_server_initial_login.json.result }}"
      id: 1
  register: zabbix_server_password_update
  failed_when: zabbix_server_password_update.json.error is defined
  no_log: true
  when: zabbix_server_managed_login.json.error is defined

- name: Log in with final Zabbix administrator password
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: Admin
        password: "{{ zabbix_server_admin_password }}"
      id: 1
  register: zabbix_server_api_login
  failed_when: zabbix_server_api_login.json.error is defined
  no_log: true

- name: Find active Linux agent template
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: template.get
      params:
        output:
          - templateid
        filter:
          host:
            - Linux by Zabbix agent active
      auth: "{{ zabbix_server_api_login.json.result }}"
      id: 2
  register: zabbix_server_linux_template
  failed_when: zabbix_server_linux_template.json.result | length != 1
  no_log: true

- name: Check Linux autoregistration action
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: action.get
      params:
        output:
          - actionid
        eventsource: 2
        filter:
          name:
            - Ansible Linux autoregistration
      auth: "{{ zabbix_server_api_login.json.result }}"
      id: 3
  register: zabbix_server_autoregistration_action
  no_log: true

- name: Create Linux active-agent autoregistration action
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: action.create
      params:
        name: Ansible Linux autoregistration
        eventsource: "2"
        filter:
          evaltype: "0"
          conditions:
            - conditiontype: "24"
              operator: "2"
              value: "linux"
        operations:
          - operationtype: "6"
            optemplate:
              - templateid: "{{ zabbix_server_linux_template.json.result[0].templateid }}"
      auth: "{{ zabbix_server_api_login.json.result }}"
      id: 4
  no_log: true
  when: zabbix_server_autoregistration_action.json.result | length == 0
