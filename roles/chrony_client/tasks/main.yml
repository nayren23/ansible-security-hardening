---
- name: Install Chrony on NTP client
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Configure NTP client timezone
  community.general.timezone:
    name: "{{ chrony_client_timezone }}"

- name: Configure internal Chrony source
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart Chrony Client

- name: Enable and start Chrony client
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Apply Chrony client configuration
  ansible.builtin.meta: flush_handlers

- name: Verify internal NTP source is configured
  ansible.builtin.command: chronyc sources -n
  register: chrony_client_sources
  changed_when: false
  failed_when: chrony_client_server not in chrony_client_sources.stdout
