---
all:
  children:
    firewalls:
      hosts:
        firewall:
          # Interface reachable from the Ansible control node on VLAN 10.
          ansible_host: 192.168.10.254

    vlan10_services:
      hosts:
        dhcp:
          ansible_host: 192.168.10.1
        dns:
          ansible_host: 192.168.10.2
        rsyslog:
          ansible_host: 192.168.10.3

    vlan20_web:
      hosts:
        web:
          ansible_host: 192.168.20.1

    vlan30_clients:
      hosts: {}
      # M1, M2, M3 and NFS are specified as DHCP clients in the subject.
      # Add them here only after DHCP reservations, leases, or DNS records
      # are known from the live GNS3 environment.

  vars:
    ansible_user: ansadmin
    ansible_become: true
